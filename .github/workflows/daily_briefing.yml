name: Daily Stock Briefing

'on':
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily briefing
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: seanc1122@gmail.com
          FROM_EMAIL: seanc1122@gmail.com
        run: python stock_briefing.py

      - name: Debug Python
        run: |
          python -c "print('Python OK'); import yfinance; print('yfinance OK'); import requests; print('requests OK')"

      - name: Run daily briefing
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: seanc1122@gmail.com
          FROM_EMAIL: seanc1122@gmail.com
          PYTHONUNBUFFERED: "1"
        run: python -u stock_briefing.py 2>&1
